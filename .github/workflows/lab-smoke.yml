name: Disposable UEFI and TPM VM Smoke
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: aegis-vmlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qemu-software-tpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout unprivileged lab code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Verify preview safety guardrail
        run: python tools/security_lint.py
      - name: Install guest-only emulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf swtpm
      - name: Confirm lab prerequisites
        run: |
          python -m lab --check
          python -m unittest discover -s tests -q
      - name: Boot disposable QEMU/OVMF/swtpm laboratory
        run: python -m lab --smoke --seconds 8
