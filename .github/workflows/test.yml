name: Preview Safety and Unit Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-safety-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail closed if preview gains execution capabilities
        run: python tools/security_lint.py
      - name: Install package without dependencies
        run: python -m pip install --no-deps -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile all sources and tests
        run: python -m compileall -q aegis tests tools
      - name: CLI smoke checks
        run: |
          aegis --help
          aegis assurance --json
          aegis inspect --inventory fixtures/desktop-example.json --json
      - name: Check installed package dependencies
        run: python -m pip check
